name: Checks

# The full suite on every pull request, not only after merging to main: a broken
# view or route used to be found by the deployment.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check and tests
        run: npm run check

      - name: Scripts load
        run: |
          node -e "require('./src/worker')"
          SQL_SETUP_DRY_RUN=1 GOVERNANCE_READER_IDENTITY_NAME=id-ci-reader node scripts/setup-sql-identities.js > /dev/null
