name: Visual regression

# Screenshots of the @podavo/ui catalogue and the Fabric Governance screens in
# light and dark mode, both density variants and the supported desktop widths.
# A screenshot without a baseline is written on its first run and uploaded as an
# artifact: commit it to accept it. A difference fails the job and the report
# shows expected, actual and diff side by side.

on:
  pull_request:
    paths:
      - 'packages/podavo-ui/**'
      - 'src/views/**'
      - 'src/public/**'
      - 'visual/**'
      - '.github/workflows/visual-regression.yml'
  workflow_dispatch:

permissions:
  # Write, so the first run on a pull request can commit the baselines it recorded.
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      # The branch itself rather than the merge commit, so recorded baselines can
      # be pushed back to it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install the design system's dev dependencies
        working-directory: packages/podavo-ui
        run: npm install --no-audit --no-fund

      # Installed without touching package.json or the lockfile: Playwright is a
      # test tool, not something the deployed app needs.
      - name: Install Playwright for the app screens
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.49.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Component contract tests
        working-directory: packages/podavo-ui
        run: npm test

      # Playwright fails a run that has to write a missing baseline, so without
      # committed baselines every pull request would fail. When none exist yet the
      # run records them instead (uploaded below, to commit); once they are
      # committed, every run compares against them as usual.
      - name: Catalogue screenshots
        working-directory: packages/podavo-ui
        run: |
          if ls tests/__screenshots__/*.png >/dev/null 2>&1; then
            npm run test:visual
          else
            echo "::warning::No catalogue baselines committed yet; recording them. Commit packages/podavo-ui/tests/__screenshots__ from the visual-regression artifact."
            npm run test:visual:update
          fi

      - name: Screen screenshots
        run: |
          if ls visual/__screenshots__/*.png >/dev/null 2>&1; then
            npm run test:visual
          else
            echo "::warning::No screen baselines committed yet; recording them. Commit visual/__screenshots__ from the visual-regression artifact."
            npm run test:visual:update
          fi

      # Baselines are committed, not only uploaded: a run without them compares
      # nothing. Only for pull requests from this repository, whose branch the
      # token may push to.
      - name: Commit recorded baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual/__screenshots__ packages/podavo-ui/tests/__screenshots__ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Baselines already committed."
          else
            git commit -m "Record visual regression baselines"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Upload report and new baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression
          path: |
            visual/.report
            visual/.results
            visual/__screenshots__
            packages/podavo-ui/playwright-report
            packages/podavo-ui/test-results
            packages/podavo-ui/tests/__screenshots__
          if-no-files-found: ignore
